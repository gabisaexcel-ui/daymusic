<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#030303" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DayMusic" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <title>DayMusic by DaySheet Group</title>
    <meta name="description" content="DayMusic by DaySheet Group - Personal Web Music & PWA Player - Stream music, explore charts, view synced lyrics, and manage custom playlists." />

    <!-- Google Fonts: Roboto & Outfit for crisp modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker handling: Clear dev cache on localhost, enable PWA in production
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const r of registrations) {
              r.unregister();
            }
          });
          if (window.caches) {
            caches.keys().then((names) => {
              for (const name of names) {
                caches.delete(name);
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch((err) => {
              console.log('SW registration skipped:', err);
            });
          });
        }
      }
    </script>
  </body>
</html>
